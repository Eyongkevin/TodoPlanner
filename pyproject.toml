[project]
name = "todo-planner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2.6",
    "django-environ>=0.12.0",
    "django-phonenumber-field[phonenumbers]>=8.3.0",
    "faker>=38.2.0",
    "model-bakery>=1.20.5",
    "psycopg>=3.2.10",
    "pytest-django>=4.11.1",
]

[dependency-groups]
dev = [
    "django-extensions>=4.1",
    "ipython>=9.5.0",
    "psycopg-binary>=3.2.10",
]
